# ACE Multi-Device Dryer Control Macros
# These macros provide easy control of individual ACE device dryers from the UI

# =============================================================================
# Per-Device Dryer Control Macros
# =============================================================================
# These macros are numbered based on the device order (ACE1, ACE2, ACE3, etc.)
# The device order is determined by USB port location.
# Use ACE_SHOW_USB_INFO to see which device is which number.

# ACE Device 1 (First device - Gates 0-3)
[gcode_macro ACE1_START_DRYER]
description: Start dryer on ACE Device 1 (Gates 0-3)
gcode:
    {% set temp = params.TEMP|default(55)|int %}
    {% set duration = params.DURATION|default(240)|int %}
    ACE_START_DRYING GATE=0 TEMP={temp} DURATION={duration}

[gcode_macro ACE1_STOP_DRYER]
description: Stop dryer on ACE Device 1
gcode:
    ACE_STOP_DRYING GATE=0

# ACE Device 2 (Second device - Gates 4-7)
[gcode_macro ACE2_START_DRYER]
description: Start dryer on ACE Device 2 (Gates 4-7)
gcode:
    {% set temp = params.TEMP|default(55)|int %}
    {% set duration = params.DURATION|default(240)|int %}
    ACE_START_DRYING GATE=4 TEMP={temp} DURATION={duration}

[gcode_macro ACE2_STOP_DRYER]
description: Stop dryer on ACE Device 2
gcode:
    ACE_STOP_DRYING GATE=4

# ACE Device 3 (Third device - Gates 8-11) - Uncomment if you have 3+ devices
# [gcode_macro ACE3_START_DRYER]
# description: Start dryer on ACE Device 3 (Gates 8-11)
# gcode:
#     {% set temp = params.TEMP|default(55)|int %}
#     {% set duration = params.DURATION|default(240)|int %}
#     ACE_START_DRYING GATE=8 TEMP={temp} DURATION={duration}

# [gcode_macro ACE3_STOP_DRYER]
# description: Stop dryer on ACE Device 3
# gcode:
#     ACE_STOP_DRYING GATE=8

# ACE Device 4 (Fourth device - Gates 12-15) - Uncomment if you have 4 devices
# [gcode_macro ACE4_START_DRYER]
# description: Start dryer on ACE Device 4 (Gates 12-15)
# gcode:
#     {% set temp = params.TEMP|default(55)|int %}
#     {% set duration = params.DURATION|default(240)|int %}
#     ACE_START_DRYING GATE=12 TEMP={temp} DURATION={duration}

# [gcode_macro ACE4_STOP_DRYER]
# description: Stop dryer on ACE Device 4
# gcode:
#     ACE_STOP_DRYING GATE=12

# =============================================================================
# Temperature Preset Macros
# =============================================================================
# These macros provide quick access to common drying temperatures for different materials
# Use DEVICE parameter to target a specific device, or use the numbered macros above

[gcode_macro DRYER_PRESET_PLA]
description: Dry PLA filament (45°C for 2 hours)
gcode:
    {% set gate = params.GATE|default(0)|int %}
    ACE_START_DRYING GATE={gate} TEMP=45 DURATION=120
    RESPOND MSG="Started PLA drying preset on gate {gate} (45°C for 2 hours)"

[gcode_macro DRYER_PRESET_PETG]
description: Dry PETG filament (55°C for 4 hours)
gcode:
    {% set gate = params.GATE|default(0)|int %}
    ACE_START_DRYING GATE={gate} TEMP=55 DURATION=240
    RESPOND MSG="Started PETG drying preset on gate {gate} (55°C for 4 hours)"

[gcode_macro DRYER_PRESET_ABS]
description: Dry ABS/ASA filament (60°C for 4 hours)
gcode:
    {% set gate = params.GATE|default(0)|int %}
    ACE_START_DRYING GATE={gate} TEMP=60 DURATION=240
    RESPOND MSG="Started ABS/ASA drying preset on gate {gate} (60°C for 4 hours)"

[gcode_macro DRYER_PRESET_NYLON]
description: Dry Nylon filament (65°C for 6 hours)
gcode:
    {% set gate = params.GATE|default(0)|int %}
    ACE_START_DRYING GATE={gate} TEMP=65 DURATION=360
    RESPOND MSG="Started Nylon drying preset on gate {gate} (65°C for 6 hours)"

[gcode_macro DRYER_PRESET_TPU]
description: Dry TPU/TPE filament (50°C for 3 hours)
gcode:
    {% set gate = params.GATE|default(0)|int %}
    ACE_START_DRYING GATE={gate} TEMP=50 DURATION=180
    RESPOND MSG="Started TPU drying preset on gate {gate} (50°C for 3 hours)"

# =============================================================================
# Utility Macros
# =============================================================================

[gcode_macro SHOW_DRYER_STATUS]
description: Display dryer status for all ACE devices
gcode:
    ACE_GET_DRYER_STATUS

[gcode_macro STOP_ALL_DRYERS]
description: Stop all dryers on all ACE devices
gcode:
    {% for device in printer.ace_manager.ace_devices %}
        ACE_STOP_DRYING GATE={device.gate_offset}
    {% endfor %}
    RESPOND MSG="All dryers stopped"

# =============================================================================
# Usage Examples:
# =============================================================================
#
# Start dryer on first device:
#   ACE1_START_DRYER TEMP=55 DURATION=240
#
# Start dryer on second device:
#   ACE2_START_DRYER TEMP=60 DURATION=180
#
# Use temperature preset:
#   DRYER_PRESET_PETG GATE=0    # Dry PETG on first device
#   DRYER_PRESET_ABS GATE=4     # Dry ABS on second device
#
# Stop specific dryer:
#   ACE1_STOP_DRYER
#   ACE2_STOP_DRYER
#
# Check dryer status:
#   SHOW_DRYER_STATUS
#
# Stop all dryers:
#   STOP_ALL_DRYERS
#
# Advanced usage (target by device ID):
#   ACE_START_DRYING DEVICE=hub_1_port_1 TEMP=60 DURATION=240
#   ACE_STOP_DRYING DEVICE=hub_1_port_1
#
# =============================================================================
# Notes:
# =============================================================================
#
# 1. Default temperature is 55°C if not specified
# 2. Default duration is 240 minutes (4 hours) if not specified
# 3. Temperature range: 1-70°C (configurable per device)
# 4. Device numbering (ACE1, ACE2, etc.) follows USB port order
# 5. Use ACE_SHOW_USB_INFO to see device-to-gate mapping
# 6. Each device's dryer operates independently
# 7. Dryer status is shown in Moonraker API under printer.ace_manager.dryers
#
