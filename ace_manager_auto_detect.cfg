# ACE Manager - Auto-Detect Configuration with USB Port Mapping
# This configuration enables automatic USB port-based device mapping
# Devices are identified by their physical USB port location

[save_variables]
filename: ~/printer_data/config/ace_vars.cfg

[respond]

[ace_manager]
# Enable auto-detection of ACE devices
# This will scan USB ports and automatically configure all connected ACE devices
auto_detect: true

# Shared configuration for ALL ACE devices
baud: 115200

# Sensor pins (UPDATE THESE for your printer!)
extruder_sensor_pin: ^EBBCan: PB9
toolhead_sensor_pin: EBBCan: PB8

# Speed settings
extruder_move_speed: 10
toolhead_homing_speed: 20
feed_speed: 80
retract_speed: 80

# Distance settings (TUNE THESE for your setup!)
toolchange_retract_length: 170  # Distance from splitter sensor to extruder sensor
toolchange_feed_length: 800     # Total feed length for tool change
toolhead_sensor_to_nozzle: 40   # Distance from toolhead sensor to nozzle

# Macro hooks
poop_macros: _POOP
cut_macros: _ACE_CUT_TIP

# Dryer temperature limit
max_dryer_temperature: 70

# =============================================================================
# HOW IT WORKS:
# =============================================================================
# 1. System scans USB ports for ACE devices on startup
# 2. Each device is identified by its USB port location (e.g., hub_1_port_2)
# 3. Gate offsets are assigned automatically based on device order:
#    - First device (lowest port) → Gates 0-3
#    - Second device → Gates 4-7
#    - Third device → Gates 8-11
#    - etc.
# 4. Device properties (colors, materials, temps) persist with the device
# 5. If you remove a device, gate numbering adjusts automatically (no gaps)
#
# EXAMPLE:
# USB Port 1 → ACE Device A → Gates 0-3 → [PLA, PETG, ABS, TPU]
# USB Port 2 → ACE Device B → Gates 4-7 → [ASA, Nylon, PC, FLEX]
# USB Port 3 → ACE Device C → Gates 8-11 → [PLA, PLA, PLA, PLA]
#
# If you remove device B and reboot:
# USB Port 1 → ACE Device A → Gates 0-3 → [PLA, PETG, ABS, TPU] (unchanged)
# USB Port 3 → ACE Device C → Gates 4-7 → [PLA, PLA, PLA, PLA] (shifted!)
#
# Device properties follow the physical device, not the gate offset!
# =============================================================================
#
# =============================================================================
# DEVICE ALIASES (New Feature):
# =============================================================================
# You can assign friendly aliases to your devices for easier identification.
# Use ACE_SHOW_USB_INFO to see device IDs, then set aliases:
#
#   ACE_ALIAS DEVICE=hub_1_port_1 NAME=ACE1
#   ACE_ALIAS DEVICE=hub_1_port_2 NAME=top_left
#   ACE_ALIAS DEVICE=hub_1_port_3 NAME=filament_tower
#
# After setting aliases, use them in any command:
#   ACE_GET_STATUS DEVICE=ACE1
#   ACE_GATE_MAP DEVICE=top_left GATE=0 COLOR=FF0000 TYPE=PLA TEMP=210
#
# Note: When using DEVICE parameter with ACE_GATE_MAP:
#   - GATE is relative to the device (0-3)
#   - Without DEVICE, GATE is global (0-15 for 4 devices)
#   Examples:
#     ACE_GATE_MAP DEVICE=ACE1 GATE=0    # First gate on ACE1
#     ACE_GATE_MAP GATE=4                # Fifth gate globally (first gate on 2nd device)
#
# Aliases persist across reboots and are stored in ace_device_map.cfg
# Remove aliases with: ACE_UNALIAS DEVICE=ACE1
# =============================================================================

# Tool change macros
# Automatically work with all detected ACE devices
# Just uncomment the tools you need based on your device count

# First ACE device (Gates 0-3)
[gcode_macro T0]
gcode:
    ACE_CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode:
    ACE_CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode:
    ACE_CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode:
    ACE_CHANGE_TOOL TOOL=3

# Second ACE device (Gates 4-7)
[gcode_macro T4]
gcode:
    ACE_CHANGE_TOOL TOOL=4

[gcode_macro T5]
gcode:
    ACE_CHANGE_TOOL TOOL=5

[gcode_macro T6]
gcode:
    ACE_CHANGE_TOOL TOOL=6

[gcode_macro T7]
gcode:
    ACE_CHANGE_TOOL TOOL=7

# Third ACE device (Gates 8-11) - Uncomment if you have 3+ devices
# [gcode_macro T8]
# gcode:
#     ACE_CHANGE_TOOL TOOL=8

# [gcode_macro T9]
# gcode:
#     ACE_CHANGE_TOOL TOOL=9

# [gcode_macro T10]
# gcode:
#     ACE_CHANGE_TOOL TOOL=10

# [gcode_macro T11]
# gcode:
#     ACE_CHANGE_TOOL TOOL=11

# Fourth ACE device (Gates 12-15) - Uncomment if you have 4 devices
# [gcode_macro T12]
# gcode:
#     ACE_CHANGE_TOOL TOOL=12

# [gcode_macro T13]
# gcode:
#     ACE_CHANGE_TOOL TOOL=13

# [gcode_macro T14]
# gcode:
#     ACE_CHANGE_TOOL TOOL=14

# [gcode_macro T15]
# gcode:
#     ACE_CHANGE_TOOL TOOL=15

# Support macros
[gcode_macro _POOP]
gcode:
    # Your purge/poop sequence here
    G1 E10 F300  # Example: extrude 10mm

[gcode_macro _ACE_CUT_TIP]
gcode:
    # Your tip cutting sequence here
    # Leave empty if no cutter installed

[gcode_macro _ACE_PRE_TOOLCHANGE]
gcode:
    # Pre-toolchange operations
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=TOOLCHANGE

[gcode_macro _ACE_POST_TOOLCHANGE]
gcode:
    # Post-toolchange operations
    RESTORE_GCODE_STATE NAME=TOOLCHANGE MOVE=1 MOVE_SPEED=250

[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    {action_respond_info("Spool is empty")}
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}

# =============================================================================
# USEFUL COMMANDS:
# =============================================================================
# ACE_SHOW_USB_INFO - Shows detailed USB port mapping and device topology
# ACE_LIST_DEVICES  - Lists all ACE devices with status
# ACE_GET_STATUS    - Gets detailed status from all ACE devices
# ACE_GATE_MAP GATE=0 COLOR=FF0000 TYPE=PLA TEMP=210 - Set gate properties
#
# Device Aliasing Commands:
# ACE_ALIAS DEVICE=hub_1_port_2 NAME=ACE1  - Set device alias
# ACE_UNALIAS DEVICE=ACE1                  - Remove device alias
# ACE_LIST_ALIASES                         - List all defined aliases
#
# Use aliases in any command that accepts DEVICE parameter:
# ACE_GET_STATUS DEVICE=ACE1
# ACE_GATE_MAP DEVICE=top_left GATE=0 COLOR=FF0000
# =============================================================================
