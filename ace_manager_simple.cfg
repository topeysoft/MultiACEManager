# ACE Manager - Simplified Configuration
# This example shows the recommended way to configure multiple ACE Pro devices
# No separate [ace ace1] sections needed!

[save_variables]
filename: /home/pi/printer_data/config/ace_vars.cfg

[respond]

[ace_manager]
# List all ACE serial ports (comma-separated)
# To find your ports, run: python3 probe_ace_ports.py --generate-config
serial_ports: /dev/ttyACM0, /dev/ttyACM1

# Shared configuration for ALL ACE devices
baud: 115200

# Sensor pins (UPDATE THESE!)
extruder_sensor_pin: ^EBBCan: PB9
toolhead_sensor_pin: EBBCan: PB8

# Speed settings
extruder_move_speed: 10
toolhead_homing_speed: 20
feed_speed: 80
retract_speed: 80

# Distance settings (TUNE THESE!)
toolchange_retract_length: 170  # Distance from splitter sensor to extruder sensor
toolchange_feed_length: 800
toolhead_sensor_to_nozzle: 40   # Distance from toolhead sensor to nozzle

# Macro hooks
poop_macros: _POOP
cut_macros: _ACE_CUT_TIP_STUB

# Dryer temperature limit
max_dryer_temperature: 70

# Tool change macros - Auto-generated for 2 ACE devices (8 gates)
# Uncomment T4-T7 for 2 ACEs, T8-T11 for 3 ACEs, T12-T15 for 4 ACEs

[gcode_macro T0]
gcode:
    ACE_CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode:
    ACE_CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode:
    ACE_CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode:
    ACE_CHANGE_TOOL TOOL=3

# Second ACE device (gates 4-7)
[gcode_macro T4]
gcode:
    ACE_CHANGE_TOOL TOOL=4

[gcode_macro T5]
gcode:
    ACE_CHANGE_TOOL TOOL=5

[gcode_macro T6]
gcode:
    ACE_CHANGE_TOOL TOOL=6

[gcode_macro T7]
gcode:
    ACE_CHANGE_TOOL TOOL=7

# Third ACE device (gates 8-11) - Uncomment if using 3 ACEs
# [gcode_macro T8]
# gcode:
#     ACE_CHANGE_TOOL TOOL=8

# [gcode_macro T9]
# gcode:
#     ACE_CHANGE_TOOL TOOL=9

# [gcode_macro T10]
# gcode:
#     ACE_CHANGE_TOOL TOOL=10

# [gcode_macro T11]
# gcode:
#     ACE_CHANGE_TOOL TOOL=11

# Fourth ACE device (gates 12-15) - Uncomment if using 4 ACEs
# [gcode_macro T12]
# gcode:
#     ACE_CHANGE_TOOL TOOL=12

# [gcode_macro T13]
# gcode:
#     ACE_CHANGE_TOOL TOOL=13

# [gcode_macro T14]
# gcode:
#     ACE_CHANGE_TOOL TOOL=14

# [gcode_macro T15]
# gcode:
#     ACE_CHANGE_TOOL TOOL=15

# Your custom macros
[gcode_macro _POOP]
gcode:
    # Implement your purge/poop routine here

[gcode_macro _ACE_CUT_TIP_STUB]
gcode:
    # Implement your tip cutting routine here

[gcode_macro _ACE_PRE_TOOLCHANGE]
variable_toolchange_temp: 220
variable_safe_z: 50
variable_safe_x: 175
variable_safe_y: 175
variable_retract_after_cut: 10
gcode:
    # Pre-toolchange logic

[gcode_macro _ACE_POST_TOOLCHANGE]
variable_purge_temp: 220
gcode:
    # Post-toolchange logic

[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    {action_respond_info("Spool is empty")}
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}

# ACE_SET_GATE and ACE_CLEAR_SELECTION are now implemented as Python commands
# in extras/commands/tool_commands.py for proper state synchronization.
# These macros have been removed to prevent conflicts.
