# ACE Pro Multi-Device Configuration
#
# Supports 1-4 ACE Pro devices (4-16 gates).
# Requires [save_variables] to be defined ABOVE this section.
#
# To find your ACE ports, run on printer:
#   python3 ~/KlipperACE/probe_ace_ports.py --generate-config

[save_variables]
filename: /home/pi/printer_data/config/ace_vars.cfg

[respond]

[ace]
# =============================================================================
# DEVICE CONNECTION (choose ONE method)
# =============================================================================

# METHOD 1: Manual Serial Ports
# Use stable /dev/serial/by-id/ paths (recommended over /dev/ttyACM*).
# Run: ls -la /dev/serial/by-id/ | grep -i anycubic
# For multiple ACEs, separate with commas (gates assigned in order: 0-3, 4-7, ...)
serial_ports: /dev/ttyACM0, /dev/ttyACM1, /dev/ttyACM3

# METHOD 2: Auto-Detection (finds all connected ACE devices automatically)
# Cannot be used together with serial_ports
# auto_detect: true

# Serial baud rate (default: 115200)
baud: 115200

# Connection retry settings
# connect_retry_delay: 1.0   # Seconds between connection retries (default: 1.0)
# connect_retry_max: 10      # Max connection attempts before giving up (default: 10)

# =============================================================================
# POLLING
# =============================================================================
# Adaptive polling adjusts poll rate based on activity:
#   Idle: 30s | Recent activity: 2s | Printing: 10s | Queue active: 0.2s
# Set to false for fixed-rate polling using poll_interval
# adaptive_polling: true     # (default: true)
# poll_interval: 2.0         # Fixed interval in seconds, only when adaptive_polling is false (default: 2.0)

# =============================================================================
# SENSORS
# =============================================================================
# DUAL SENSOR MODE (recommended): set both pins
#   - extruder sensor: triggers when filament reaches extruder entrance
#   - toolhead sensor: triggers when filament reaches toolhead (closer to nozzle)
#   - requires toolhead_sensor_to_nozzle to be set
#
# SINGLE SENSOR MODE: set only extruder_sensor_pin
#   - comment out toolhead_sensor_pin
#   - requires extruder_sensor_to_nozzle to be set instead

extruder_sensor_pin: ^EBBCan:PB9
toolhead_sensor_pin: ^EBBCan:PB8   # Comment this line for single-sensor mode

# =============================================================================
# SPEED SETTINGS (mm/s)
# =============================================================================

# Extruder stepper speed during tool changes
extruder_move_speed: 5            # (default: 5)

# Speed when approaching the toolhead sensor during load
toolhead_homing_speed: 20          # (default: 10)

# ACE gate feed speed (gate -> extruder)
feed_speed: 80                     # (default: 50)

# ACE gate retract speed (extruder -> gate)
retract_speed: 50                  # (default: 50)

# ACE pull speed during sensor-clear attempts (low for precision)
sensor_clear_speed: 20             # (default: 20)

# =============================================================================
# DISTANCE SETTINGS (mm)
# =============================================================================

# --- Tool change distances ---

# Distance from splitter to extruder sensor. ACE pulls this distance to fully
# retract filament back to the gate after the extruder sensor has been cleared.
toolchange_retract_length: 150     # (default: 100)

# Total bowden distance from ACE gate to extruder sensor. ACE feeds this distance
# when loading a new tool; speed is reduced to toolhead_homing_speed near the end.
toolchange_feed_length: 1600       # (default: 100)

# Max distance to search for the toolhead sensor when loading (dual sensor mode)
toolhead_homing_max: 80            # (default: 100)

# --- Sensor-to-nozzle distances (choose one based on sensor mode) ---

# DUAL SENSOR MODE: distance from toolhead sensor to nozzle tip
toolhead_sensor_to_nozzle: 20      # (default: 0)

# SINGLE SENSOR MODE: distance from extruder sensor to nozzle tip
# Only used when toolhead_sensor_pin is not set
# extruder_sensor_to_nozzle: 120   # (default: 0)

# --- Unload / sensor clearing distances ---

# Distance the extruder retracts per attempt when clearing the extruder sensor.
# This is the estimated distance from cutter to clear the extruder.
extruder_clearance_length: 70      # (default: 20)

# Max distance ACE pulls per attempt to test if filament clears the extruder sensor
sensor_clear_max_distance: 20      # (default: 20)

# Retract after extruder sensor triggers during load to compensate for overshoot (0 = disabled)
# sensor_overshoot_compensation: 0 # (default: 0)

# Seconds to wait after disabling feed assist before proceeding with unload.
# Ensures the ACE gate motor has fully stopped.
feed_assist_disable_delay: 2.0     # (default: 2.0)

# =============================================================================
# TEMPERATURE MANAGEMENT
# =============================================================================

# Pre-heat extruder to the target tool's temperature before loading
# enable_temp_preheat: true        # (default: true)

# Only pre-heat if temperature difference exceeds this threshold (degrees C)
# temp_preheat_threshold: 20       # (default: 20)

# Time to wait after reaching target temperature before proceeding (seconds)
# temp_stabilize_time: 3.0         # (default: 3.0)

# =============================================================================
# MACROS
# =============================================================================

# Purge/prime macro executed after loading a new tool
poop_macros: _POOP                 # (default: _POOP)

# Tip cutting macro executed before unloading (at nozzle position)
cut_macros: _ACE_CUT_TIP_STUB     # (default: _CUT_TIP)

# Error handling macro called on sensor failures
# Called with: {error_macros} TOOL=<n> ERROR='<error_type>'
error_macros: _ACE_ON_SENSOR_ERROR

# =============================================================================
# DRYER
# =============================================================================

# Max dryer temperature safety limit
max_dryer_temperature: 70          # (default: 55)

# =============================================================================
# ADVANCED
# =============================================================================

# Log level for ACE module output: DEBUG, INFO, WARNING, ERROR
# log_level: INFO                  # (default: INFO)

# Auto-register T0-T15 gcode macros based on detected gate count.
# When true, you don't need the [gcode_macro T0..T15] sections below.
# auto_register_t_macros: false    # (default: false)



# Actual macro implementation is nozzle_purge in macros.cfg
[gcode_macro _POOP]
gcode:



# Stub for ACE - actual implementation in filament.cfg
[gcode_macro _ACE_CUT_TIP_STUB]
gcode:




#TUNE ME
[gcode_macro _ACE_PRE_TOOLCHANGE]
variable_toolchange_temp: 220
variable_safe_z: 50
variable_safe_x: 175
variable_safe_y: 175
variable_retract_after_cut: 10
gcode:
    {% set TO = params.TO|default(-1)|int %}
    {% set gate_temps = printer.save_variables.variables.ace_gate_temp %}
    {% set extrude_temp = gate_temps[TO] if TO >= 0 and TO < gate_temps|length else toolchange_temp %}

    # NOZZLE_PRE_TOOL_CHANGE TEMP={extrude_temp}



[gcode_macro _ACE_POST_TOOLCHANGE]
variable_purge_temp: 220
gcode:
    # NOZZLE_POST_TOOL_CHANGE


[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    {action_respond_info("Spool is empty")}
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}





# ACE_SET_GATE and ACE_CLEAR_SELECTION are now implemented as Python commands
# in extras/commands/tool_commands.py for proper state synchronization.
# These macros have been removed to prevent conflicts.


# Tool change macros for ACE Pro
# Uncomment the T macros you need based on your setup:
# - 1 ACE (4 gates): T0-T3
# - 2 ACEs (8 gates): T0-T7
# - 3 ACEs (12 gates): T0-T11
# - 4 ACEs (16 gates): T0-T15

# ACE 1 - Gates 0-3
[gcode_macro T0]
gcode:
    ACE_CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode:
    ACE_CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode:
    ACE_CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode:
    ACE_CHANGE_TOOL TOOL=3

ACE 2 - Gates 4-7 (Uncomment if using 2+ ACEs)
[gcode_macro T4]
gcode:
    ACE_CHANGE_TOOL TOOL=4

[gcode_macro T5]
gcode:
    ACE_CHANGE_TOOL TOOL=5

[gcode_macro T6]
gcode:
    ACE_CHANGE_TOOL TOOL=6

[gcode_macro T7]
gcode:
    ACE_CHANGE_TOOL TOOL=7

ACE 3 - Gates 8-11 (Uncomment if using 3+ ACEs)
[gcode_macro T8]
gcode:
    ACE_CHANGE_TOOL TOOL=8

[gcode_macro T9]
gcode:
    ACE_CHANGE_TOOL TOOL=9

[gcode_macro T10]
gcode:
    ACE_CHANGE_TOOL TOOL=10

[gcode_macro T11]
gcode:
    ACE_CHANGE_TOOL TOOL=11

ACE 4 - Gates 12-15 (Uncomment if using 4 ACEs)
[gcode_macro T12]
gcode:
    ACE_CHANGE_TOOL TOOL=12

[gcode_macro T13]
gcode:
    ACE_CHANGE_TOOL TOOL=13

[gcode_macro T14]
gcode:
    ACE_CHANGE_TOOL TOOL=14

[gcode_macro T15]
gcode:
    ACE_CHANGE_TOOL TOOL=15

