# ACE Pro Multi-Device Configuration
#
# To find your ACE ports, run on printer:
#   python3 ~/KlipperACE/probe_ace_ports.py --generate-config
#
# This config supports 1-4 ACE Pro devices (4-16 gates)
# Please check that [save_variables] is above [ace_manager] if you're using different config

[save_variables]
filename: /home/pi/printer_data/config/ace_vars.cfg

[respond]

[ace]
# MULTI-ACE CONFIGURATION (Choose ONE method below)
#
# METHOD 1: Manual Serial Ports (Recommended)
# List all ACE serial ports separated by commas
# For 1 ACE (4 gates): Just one port
# For 2 ACEs (8 gates): Two ports (gates 0-3, 4-7)
# For 3 ACEs (12 gates): Three ports (gates 0-3, 4-7, 8-11)
# For 4 ACEs (16 gates): Four ports (gates 0-3, 4-7, 8-11, 12-15)
#
# UPDATE THIS: Add your second ACE port if you have 2 ACEs
# For manual port specification, use stable /dev/serial/by-id/ paths (recommended)
# Run on your Pi: ls -la /dev/serial/by-id/ | grep -i anycubic
# serial_ports: /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
# If you have multiple ACEs, use this format:
# serial_ports: /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00, /dev/serial/by-id/usb-ANYCUBIC_ACE_2-if00, /dev/serial/by-id/usb-ANYCUBIC_ACE_3-if00
# Or use /dev/ttyACM paths (less stable, may change on reboot):
serial_ports: /dev/ttyACM0, /dev/ttyACM1, /dev/ttyACM3

# METHOD 2: Auto-Detection (Recommended - automatically finds all connected ACE devices)
# NOTE: All other parameters below (baud, extruder_sensor_pin, etc.) are still required
# even when using auto_detect, as they're used to configure the detected ACE devices
# auto_detect: true

baud: 115200
# Extruder_sensor_pin
extruder_sensor_pin: ^EBBCan:PB9
# Toolhead_sensor_pin
toolhead_sensor_pin: ^EBBCan:PB8
# Default extruder speed, 10-20 in stock
extruder_move_speed: 10
# Default extruder speed, 10-30 in stock
toolhead_homing_speed: 20
# Default feeding speed, 10-25 in stock
feed_speed: 80
# Default retraction speed, 10-25 in stock
retract_speed: 80
# Length of the retract to make for toolchange
toolchange_retract_length: 170 # Distance from spliter sensor to extruder sensor
toolchange_feed_length: 800
toolhead_sensor_to_nozzle: 40  # Distance from toolhead sensor to nozzle
poop_macros: _POOP
cut_macros: _ACE_CUT_TIP_STUB
# Max dryer temperature. If you want to fry your dryer, then you can! (Just joking, should be safe around ~70, but it's not tested yet)
max_dryer_temperature: 70



# Actual macro implementation is nozzle_purge in macros.cfg
[gcode_macro _POOP]
gcode:



# Stub for ACE - actual implementation in filament.cfg
[gcode_macro _ACE_CUT_TIP_STUB]
gcode:




#TUNE ME
[gcode_macro _ACE_PRE_TOOLCHANGE]
variable_toolchange_temp: 220
variable_safe_z: 50
variable_safe_x: 175
variable_safe_y: 175
variable_retract_after_cut: 10
gcode:
    # NOZZLE_PRE_TOOL_CHANGE



[gcode_macro _ACE_POST_TOOLCHANGE]
variable_purge_temp: 220
gcode:
    # NOZZLE_POST_TOOL_CHANGE


[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    {action_respond_info("Spool is empty")}
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}




[gcode_macro ACE_SET_SELECTED]
description: Manually set the selected gate for UI sync
gcode:
    {% set gate = params.GATE|default(-1)|int %}
    SAVE_VARIABLE VARIABLE=ace_current_index VALUE={gate}
    RESPOND MSG="Selected gate set to {gate}"

[gcode_macro ACE_CLEAR_SELECTION]
description: Clear gate selection without unloading
gcode:
    SAVE_VARIABLE VARIABLE=ace_current_index VALUE=-1
    RESPOND MSG="Gate selection cleared"


# Tool change macros for ACE Pro
# Uncomment the T macros you need based on your setup:
# - 1 ACE (4 gates): T0-T3
# - 2 ACEs (8 gates): T0-T7
# - 3 ACEs (12 gates): T0-T11
# - 4 ACEs (16 gates): T0-T15

# ACE 1 - Gates 0-3
[gcode_macro T0]
gcode:
    ACE_CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode:
    ACE_CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode:
    ACE_CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode:
    ACE_CHANGE_TOOL TOOL=3

ACE 2 - Gates 4-7 (Uncomment if using 2+ ACEs)
[gcode_macro T4]
gcode:
    ACE_CHANGE_TOOL TOOL=4

[gcode_macro T5]
gcode:
    ACE_CHANGE_TOOL TOOL=5

[gcode_macro T6]
gcode:
    ACE_CHANGE_TOOL TOOL=6

[gcode_macro T7]
gcode:
    ACE_CHANGE_TOOL TOOL=7

ACE 3 - Gates 8-11 (Uncomment if using 3+ ACEs)
[gcode_macro T8]
gcode:
    ACE_CHANGE_TOOL TOOL=8

[gcode_macro T9]
gcode:
    ACE_CHANGE_TOOL TOOL=9

[gcode_macro T10]
gcode:
    ACE_CHANGE_TOOL TOOL=10

[gcode_macro T11]
gcode:
    ACE_CHANGE_TOOL TOOL=11

ACE 4 - Gates 12-15 (Uncomment if using 4 ACEs)
[gcode_macro T12]
gcode:
    ACE_CHANGE_TOOL TOOL=12

[gcode_macro T13]
gcode:
    ACE_CHANGE_TOOL TOOL=13

[gcode_macro T14]
gcode:
    ACE_CHANGE_TOOL TOOL=14

[gcode_macro T15]
gcode:
    ACE_CHANGE_TOOL TOOL=15

