# ACE Manager Configuration Example
# Supports 2, 3, 4, or more ACE Pro devices in a unified multi-gate system

[save_variables]
filename: ~/printer_data/config/ace_vars.cfg

[respond]

# ============================================================
# ACE MANAGER - Unified Multi-ACE Control
# ============================================================
[ace_manager]
# List all your ACE devices (comma-separated)
# For 2 ACEs: ace_devices: ace1, ace2
# For 3 ACEs: ace_devices: ace1, ace2, ace3
# For 4 ACEs: ace_devices: ace1, ace2, ace3, ace4
ace_devices: ace1, ace2

# The manager will automatically assign gate offsets:
# ace1 -> gates 0-3
# ace2 -> gates 4-7
# ace3 -> gates 8-11 (if configured)
# ace4 -> gates 12-15 (if configured)

# ============================================================
# INDIVIDUAL ACE DEVICE CONFIGURATIONS
# ============================================================

# First ACE Pro (gates 0-3)
[ace ace1]
serial: /dev/ttyACM0
baud: 115200
extruder_sensor_pin: ^EBBCan: PB9
toolhead_sensor_pin: EBBCan: PB8
feed_speed: 80
retract_speed: 80
toolchange_retract_length: 170
toolchange_feed_length: 800
toolhead_sensor_to_nozzle: 40
poop_macros: _POOP
cut_macros: _ACE_CUT_TIP
max_dryer_temperature: 70

# Second ACE Pro (gates 4-7)
[ace ace2]
serial: /dev/ttyACM1
baud: 115200
extruder_sensor_pin: ^EBBCan: PB9  # Shared with ace1
toolhead_sensor_pin: EBBCan: PB8   # Shared with ace1
feed_speed: 80
retract_speed: 80
toolchange_retract_length: 170
toolchange_feed_length: 800
toolhead_sensor_to_nozzle: 40
poop_macros: _POOP
cut_macros: _ACE_CUT_TIP
max_dryer_temperature: 70

# Third ACE Pro (gates 8-11) - OPTIONAL
# Uncomment if you have 3 ACE units
# [ace ace3]
# serial: /dev/ttyACM3  # Adjust based on your USB enumeration
# baud: 115200
# extruder_sensor_pin: ^EBBCan: PB9
# toolhead_sensor_pin: EBBCan: PB8
# feed_speed: 80
# retract_speed: 80
# toolchange_retract_length: 170
# toolchange_feed_length: 800
# toolhead_sensor_to_nozzle: 40
# poop_macros: _POOP
# cut_macros: _ACE_CUT_TIP
# max_dryer_temperature: 70

# Fourth ACE Pro (gates 12-15) - OPTIONAL
# Uncomment if you have 4 ACE units
# [ace ace4]
# serial: /dev/ttyACM4  # Adjust based on your USB enumeration
# baud: 115200
# extruder_sensor_pin: ^EBBCan: PB9
# toolhead_sensor_pin: EBBCan: PB8
# feed_speed: 80
# retract_speed: 80
# toolchange_retract_length: 170
# toolchange_feed_length: 800
# toolhead_sensor_to_nozzle: 40
# poop_macros: _POOP
# cut_macros: _ACE_CUT_TIP
# max_dryer_temperature: 70

# ============================================================
# TOOL CHANGE MACROS
# ============================================================
# These are managed by ACE Manager and work across all ACE units

# Gates 0-3 (ACE1)
[gcode_macro T0]
gcode:
    ACE_CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode:
    ACE_CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode:
    ACE_CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode:
    ACE_CHANGE_TOOL TOOL=3

# Gates 4-7 (ACE2)
[gcode_macro T4]
gcode:
    ACE_CHANGE_TOOL TOOL=4

[gcode_macro T5]
gcode:
    ACE_CHANGE_TOOL TOOL=5

[gcode_macro T6]
gcode:
    ACE_CHANGE_TOOL TOOL=6

[gcode_macro T7]
gcode:
    ACE_CHANGE_TOOL TOOL=7

# Gates 8-11 (ACE3) - Uncomment if using 3+ ACEs
# [gcode_macro T8]
# gcode:
#     ACE_CHANGE_TOOL TOOL=8

# [gcode_macro T9]
# gcode:
#     ACE_CHANGE_TOOL TOOL=9

# [gcode_macro T10]
# gcode:
#     ACE_CHANGE_TOOL TOOL=10

# [gcode_macro T11]
# gcode:
#     ACE_CHANGE_TOOL TOOL=11

# Gates 12-15 (ACE4) - Uncomment if using 4 ACEs
# [gcode_macro T12]
# gcode:
#     ACE_CHANGE_TOOL TOOL=12

# [gcode_macro T13]
# gcode:
#     ACE_CHANGE_TOOL TOOL=13

# [gcode_macro T14]
# gcode:
#     ACE_CHANGE_TOOL TOOL=14

# [gcode_macro T15]
# gcode:
#     ACE_CHANGE_TOOL TOOL=15

# ============================================================
# SUPPORT MACROS
# ============================================================

[gcode_macro _POOP]
gcode:
    # Your purge/poop sequence here
    G1 E10 F300  # Example: extrude 10mm

[gcode_macro _ACE_CUT_TIP]
gcode:
    # Your tip cutting sequence here
    # Leave empty if no cutter installed

[gcode_macro _ACE_PRE_TOOLCHANGE]
gcode:
    # Pre-toolchange operations
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=TOOLCHANGE

[gcode_macro _ACE_POST_TOOLCHANGE]
gcode:
    # Post-toolchange operations
    RESTORE_GCODE_STATE NAME=TOOLCHANGE MOVE=1 MOVE_SPEED=250

[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    {action_respond_info("Spool is empty")}
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}
