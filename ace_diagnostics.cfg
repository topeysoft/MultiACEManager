# ACE Pro Diagnostic Macros
# Tools for discovering undocumented ACE functionality and monitoring advanced features

[gcode_macro ACE_TEST_METHOD]
description: Test undocumented ACE API methods
gcode:
    {% set method = params.METHOD|default('') %}
    {% set params_json = params.PARAMS|default('{}') %}

    {% if method == '' %}
        {action_respond_info("Usage: ACE_TEST_METHOD METHOD=<method_name> [PARAMS='{\"key\":\"value\"}']\n\nSuggested methods to try:\n  get_capabilities\n  get_methods\n  get_diagnostics\n  get_errors\n  get_jam_status\n  get_blockage_status\n  get_load_status\n  get_tension\n  get_sensors\n  get_sensor_data\n  get_motor_current\n  get_encoder_position\n  clear_jam\n  reset_jam_detection\n  get_maintenance\n  get_version\n  get_config")}
    {% else %}
        {action_respond_info("Testing method: " + method)}
        ACE_DEBUG METHOD={method} PARAMS='{params_json}'
    {% endif %}

[gcode_macro ACE_FULL_STATUS_DUMP]
description: Dump complete ACE status with all fields for analysis
gcode:
    {action_respond_info("=== ACE FULL STATUS DUMP ===")}
    {action_respond_info("Requesting complete status from ACE...")}
    ACE_DEBUG METHOD=get_status

[gcode_macro ACE_DISCOVER_SLOTS]
description: Analyze all slot status fields
gcode:
    {action_respond_info("=== ACE SLOT DISCOVERY ===")}
    {action_respond_info("Analyzing slot data for undocumented fields...")}
    {action_respond_info("Check response for fields like:")}
    {action_respond_info("  - jam_detected, jammed, blocked")}
    {action_respond_info("  - load_failures, error_count")}
    {action_respond_info("  - motor_current, motor_load")}
    {action_respond_info("  - encoder_position, tension")}
    {action_respond_info("  - sensor_state, sensor_raw")}
    ACE_DEBUG METHOD=get_status

[gcode_macro ACE_MONITOR_FEED_ASSIST]
description: Monitor feed assist metrics during operation
gcode:
    {% set index = params.INDEX|default(0)|int %}

    {action_respond_info("=== FEED ASSIST MONITORING ===")}
    {action_respond_info("Index: " + index|string)}
    {action_respond_info("Monitoring feed_assist_count and cont_assist_time...")}
    {action_respond_info("These values may indicate motor load/resistance")}
    {action_respond_info("")}

    # Enable feed assist
    ACE_ENABLE_FEED_ASSIST INDEX={index}
    G4 P1000

    # Get status to check metrics
    ACE_DEBUG METHOD=get_status
    {action_respond_info("Check feed_assist_count and cont_assist_time in response")}

[gcode_macro ACE_TEST_ERROR_CONDITIONS]
description: Test how ACE reports various error states
gcode:
    {action_respond_info("=== ACE ERROR CONDITION TESTING ===")}
    {action_respond_info("Testing empty spool detection...")}
    {action_respond_info("")}

    # Test each gate
    {% for i in range(4) %}
        {action_respond_info("Gate " + i|string + ":")}
        ACE_DEBUG METHOD=get_status
        G4 P500
    {% endfor %}

    {action_respond_info("")}
    {action_respond_info("Manual test: Try feeding from empty gate and check for:")}
    {action_respond_info("  - status field changes")}
    {action_respond_info("  - error codes in response")}
    {action_respond_info("  - jam/blockage indicators")}

[gcode_macro ACE_PROBE_METHODS]
description: Systematically probe for valid ACE methods
gcode:
    {action_respond_info("=== ACE METHOD DISCOVERY ===")}
    {action_respond_info("Testing common method naming patterns...")}
    {action_respond_info("")}

    # Test get_ methods
    {% set methods = [
        'get_capabilities',
        'get_methods',
        'get_diagnostics',
        'get_errors',
        'get_error_log',
        'get_warnings',
        'get_jam_status',
        'get_blockage_status',
        'get_load_status',
        'get_tension',
        'get_sensors',
        'get_sensor_data',
        'get_sensor_raw',
        'get_motor_current',
        'get_motor_status',
        'get_encoder_position',
        'get_encoder_data',
        'get_maintenance',
        'get_maintenance_data',
        'get_stats',
        'get_statistics',
        'get_version',
        'get_versions',
        'get_config',
        'get_configuration',
        'get_device_info',
        'get_hardware_info',
        'get_slot_info',
        'get_all_slots',
        'get_dryer_info',
        'get_fan_speed',
        'get_rfid_data'
    ] %}

    {% for method in methods %}
        {action_respond_info("Testing: " + method)}
        ACE_DEBUG METHOD={method}
        G4 P200
    {% endfor %}

    {action_respond_info("")}
    {action_respond_info("=== Method probing complete ===")}
    {action_respond_info("Check console for successful responses")}

[gcode_macro ACE_MONITOR_JAM_INDICATORS]
description: Monitor for jam detection indicators during feed
gcode:
    {% set index = params.INDEX|default(0)|int %}
    {% set length = params.LENGTH|default(50)|int %}

    {action_respond_info("=== JAM DETECTION MONITORING ===")}
    {action_respond_info("Will feed " + length|string + "mm from gate " + index|string)}
    {action_respond_info("Watch for changes in:")}
    {action_respond_info("  - feed_assist_count")}
    {action_respond_info("  - cont_assist_time")}
    {action_respond_info("  - slot status")}
    {action_respond_info("  - any error fields")}
    {action_respond_info("")}

    # Get baseline
    {action_respond_info("BASELINE STATUS:")}
    ACE_DEBUG METHOD=get_status
    G4 P1000

    # Perform feed
    {action_respond_info("")}
    {action_respond_info("FEEDING...")}
    ACE_FEED INDEX={index} LENGTH={length}

    # Check status during/after
    {action_respond_info("")}
    {action_respond_info("POST-FEED STATUS:")}
    ACE_DEBUG METHOD=get_status

    {action_respond_info("")}
    {action_respond_info("Compare baseline vs post-feed values")}

[gcode_macro ACE_EXPORT_FULL_STATE]
description: Export complete ACE state for documentation
gcode:
    {action_respond_info("=== COMPLETE ACE STATE EXPORT ===")}
    {action_respond_info("")}

    # Device info
    {action_respond_info("1. DEVICE INFO:")}
    ACE_DEBUG METHOD=get_info
    G4 P500

    # Full status
    {action_respond_info("")}
    {action_respond_info("2. FULL STATUS:")}
    ACE_DEBUG METHOD=get_status
    G4 P500

    {action_respond_info("")}
    {action_respond_info("=== Export complete ===")}
    {action_respond_info("Save console output for analysis")}

